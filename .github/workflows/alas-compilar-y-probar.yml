name: ALAS · Compilar y probar

# Se ejecuta en cada cambio subido y en cada Pull Request.
# (Recommit para que GitHub registre el workflow tras el push inicial del repo.)
on:
  push:
    branches: [ main, master ]
    paths: [ 'SistemaAerolinea/**', '.github/workflows/alas-compilar-y-probar.yml' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar ALAS y correr las pruebas
    runs-on: windows-latest
    defaults:
      run:
        working-directory: SistemaAerolinea

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restaurar dependencias
        run: dotnet restore SistemaAerolinea.slnx

      - name: Compilar la solución
        run: dotnet build SistemaAerolinea.slnx --no-restore --configuration Release

      # Las pruebas que necesitan SQL Server se dan por buenas cuando no hay
      # servidor disponible, así que aquí corren igual las de lógica pura.
      - name: Correr las pruebas unitarias
        run: dotnet test SistemaAerolinea.Tests/SistemaAerolinea.Tests.vbproj --configuration Release --verbosity normal
